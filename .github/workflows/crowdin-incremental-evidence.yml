name: Crowdin realistic read-only evidence

on:
  push:
    branches:
      - codex/crowdin-realistic-delivery-20260911

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'aidanaden/jupiter-i18n-translation-pilot' && github.ref == 'refs/heads/codex/crowdin-realistic-delivery-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Observe current file26 without source sync, AI, review, or delivery
        run: node scripts/provider-e2e/crowdin-realistic-observe.mjs "$RUNNER_TEMP/crowdin-incremental-evidence"
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_AI_RECORDING_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: crowdin-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crowdin-incremental-evidence
          retention-days: 7
          if-no-files-found: error
