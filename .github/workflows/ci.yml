name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run scheduler:cf-typegen
      - run: pnpm run format:check
      - run: pnpm run lint:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run i18n:sync
      - run: >-
          git diff --exit-code -- .
          ':(exclude)src/i18n/locales/zh-Hans/messages.po'
          ':(exclude)src/i18n/locales/zh-Hans/messages.ts'
      - if: github.event_name == 'pull_request' && github.base_ref == 'aidan/provider-e2e-lingo-base'
        run: pnpm run verify:ssr:lingo-e2e
      - if: github.event_name == 'pull_request' && github.base_ref == 'aidan/provider-e2e-lingo-base'
        run: pnpm run verify:lingo-e2e:dry-run
      - if: github.event_name == 'pull_request' && github.base_ref == 'aidan/provider-e2e-crowdin-ai-base'
        run: pnpm run build
      - if: github.event_name != 'pull_request' || (github.base_ref != 'aidan/provider-e2e-lingo-base' && github.base_ref != 'aidan/provider-e2e-crowdin-ai-base')
        run: pnpm run verify:ssr
      - if: github.event_name != 'pull_request' || (github.base_ref != 'aidan/provider-e2e-lingo-base' && github.base_ref != 'aidan/provider-e2e-crowdin-ai-base')
        run: pnpm run verify:rehearsal-reset-plan
      - if: github.event_name != 'pull_request' || (github.base_ref != 'aidan/provider-e2e-lingo-base' && github.base_ref != 'aidan/provider-e2e-crowdin-ai-base')
        run: pnpm run verify:rehearsal-reset-execution
      - if: github.event_name != 'pull_request' || (github.base_ref != 'aidan/provider-e2e-lingo-base' && github.base_ref != 'aidan/provider-e2e-crowdin-ai-base')
        run: pnpm run verify:rehearsal-translated
      - if: github.event_name != 'pull_request' || (github.base_ref != 'aidan/provider-e2e-lingo-base' && github.base_ref != 'aidan/provider-e2e-crowdin-ai-base')
        run: pnpm run deploy:dry-run
      - run: pnpm run scheduler:deploy:dry-run
