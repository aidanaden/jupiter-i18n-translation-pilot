name: Export approved Crowdin translations
run-name: Crowdin export [${{ github.event_name == 'schedule' && 'github-schedule' || inputs.dispatch_id || 'manual' }}]

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Stable ID supplied by the external scheduler
        required: false
        type: string
      scheduled_for:
        description: Intended UTC export time supplied by the external scheduler
        required: false
        type: string

concurrency:
  group: crowdin-export
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Verify the live Crowdin branch
        env:
          CROWDIN_BRANCH_ID: ${{ vars.CROWDIN_BRANCH_ID }}
          CROWDIN_BRANCH_NAME: ${{ vars.CROWDIN_BRANCH_NAME }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        run: node scripts/verify-crowdin-export-branch.mjs
      - uses: crowdin/github-action@71fdb8814261dd703be4ca7c6450d21b1868da4b
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          download_language: zh-CN
          export_only_approved: true
          skip_untranslated_strings: true
          push_translations: true
          localization_branch_name: l10n
          create_pull_request: true
          pull_request_base_branch_name: main
          crowdin_branch_name: ${{ vars.CROWDIN_BRANCH_NAME }}
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
