name: Crowdin AI native evidence

on:
  push:
    branches:
      - aidan/crowdin-ai-recording-02

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'aidanaden/jupiter-i18n-translation-pilot' && github.ref == 'refs/heads/aidan/crowdin-ai-recording-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read isolated native records
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_AI_RECORDING_TOKEN }}
        run: node scripts/provider-e2e/crowdin-ai-native-read.mjs "$RUNNER_TEMP/crowdin-ai-native-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: crowdin-ai-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crowdin-ai-native-evidence
          retention-days: 7
          if-no-files-found: error
