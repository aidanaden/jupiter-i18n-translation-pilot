name: Verify approved Crowdin source update

on:
  push:
    branches:
      - aidan/crowdin-ai-visible-source-check-20260910

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: write

jobs:
  source-safety:
    if: github.repository == 'aidanaden/jupiter-i18n-translation-pilot' && github.ref == 'refs/heads/aidan/crowdin-ai-visible-source-check-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/provider-e2e/crowdin-ai-auto-source-check.mjs
        env:
          GH_TOKEN: ${{ github.token }}
